name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: yuna_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d yuna_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/yuna_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:sdk
      - run: npm run test:integration
      - name: Dependency security report
        run: npm audit --omit=dev --audit-level=high
      - name: Build container
        run: docker build -t yuna-chan:ci .
      - name: Export resolved dependency lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: warn
